<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>15 Puzzle</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="beach">

<header>
    <h1>15 Puzzle</h1>

    <div class="mode-description">
        <h2 id="mode-title">Beach - 4x4 Puzzle</h2>
    </div>
</header>


<main>

<section class="controls">

    <div>
        <p><strong>Theme</strong></p>

        <button data-theme="beach">
            Beach
        </button>

        <button data-theme="coconut">
            Coconut Beach
        </button>

        <button data-theme="night_beach">
            Night Beach
        </button>
    </div>


    <br>


    <div>
        <label for="difficulty">
            <strong>Difficulty</strong>
        </label>


        <select id="difficulty">

            <option value="4">
                Normal (4x4)
            </option>

            <option value="5">
                Hard (5x5)
            </option>

            <option value="6">
                Expert (6x6)
            </option>

        </select>

    </div>


    <br>


    <div>
        <label for="track">
            <strong>Gameplay Style</strong>
        </label>


        <select id="track">

            <option value="normal">
                Normal
            </option>

            <option value="assisted">
                Assisted
            </option>

        </select>

    </div>


    <br>


    <button id="start">
        ▶ Start Game
    </button>


    <button id="shuffle">
        🔀 Shuffle
    </button>


    <button id="reset">
        ↻ Reset
    </button>


    <button id="music-toggle">
        🎵 Music: Off
    </button>


    <button id="hint">
        ✨ Hint (3)
    </button>


</section>



<section id="stats">

    <h3>
        Current Game
    </h3>


    <p>
        Moves:
        <span id="moves">
            0
        </span>
    </p>


    <p>
        Time:
        <span id="timer">
            0
        </span>
        seconds
    </p>


</section>



<section id="analytics">

    <h3>
        Session Statistics
    </h3>


    <p>
        Games Completed:
        <span id="sessions">
            0
        </span>
    </p>


    <p>
        Average Moves:
        <span id="average-moves">
            0
        </span>
    </p>


    <p>
        Average Time:
        <span id="average-time">
            0
        </span>
        seconds
    </p>


</section>



<section>

<div id="board"></div>

</section>



<section>

<h2>
    Leaderboard
</h2>


<table>

<thead>

<tr>

<th>
    Player
</th>

<th>
    Mode
</th>

<th>
    Moves
</th>

<th>
    Time
</th>

</tr>

</thead>


<tbody id="scores">

</tbody>


</table>


</section>


</main>



<audio id="ambience-audio" loop>

    <source src="audio/ambience.mp3"
            type="audio/mpeg">

</audio>



<audio id="difficulty-audio" loop preload="auto">

</audio>



<audio id="move-audio">

    <source src="audio/effects/whoosh.mp3"
            type="audio/mpeg">

</audio>



<audio id="success-audio">

    <source src="audio/effects/success.mp3"
            type="audio/mpeg">

</audio>



<audio id="hint-audio">

    <source src="audio/effects/chime.mp3"
            type="audio/mpeg">

</audio>



<script src="js/game.js"></script>

<script src="js/ui.js"></script>

<script src="js/leaderboard.js"></script>


</body>

</html>
